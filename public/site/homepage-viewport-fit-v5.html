<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>首页视口比例 V5</title>
  <style>
    :root {
      --canvas: #eeeeee;
      --ink: #1d1812;
      --muted: #524d46;
      --placeholder-a: #c4c4c0;
      --placeholder-b: #b7b7b3;
      --placeholder-c: #d0d0cc;
      --brand-orange: #fe5416;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: Arial, "Noto Sans SC", sans-serif;
    }
    .page {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
    }
    .home-transition-frame-preview {
      position: absolute;
      inset: 0;
      z-index: 20;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      transform: translateY(15px) scale(1.05);
      pointer-events: none;
      user-select: none;
    }
    .home-transition-frame-preview[hidden] { display: none; }
    .page .portrait { z-index: 21; }
    .home-transition-frame-preview.is-frame-foreground { z-index: 22; }
    .is-home-transition-dragging,
    .is-home-transition-dragging * { cursor: grabbing !important; }
    .page::after {
      content: "";
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      top: var(--orbit-mask-top, 76%);
      bottom: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 0, var(--canvas) 36px);
    }
    .utility {
      position: absolute;
      z-index: 10;
      top: clamp(16px, 2vh, 28px);
      right: clamp(18px, 2.4vw, 48px);
      display: flex;
      gap: clamp(14px, 1.5vw, 28px);
      font: 500 clamp(10px, .7vw, 13px)/1.2 ui-monospace, monospace;
      color: var(--muted);
    }
    .side-copy {
      position: absolute;
      left: clamp(20px, 2.5vw, 52px);
      top: 10vh;
      height: 62vh;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: clamp(10px, .75vw, 14px);
      line-height: 1.55;
      color: var(--muted);
    }
    .ghost-script {
      position: absolute;
      inset: calc(-4vh - 20px) calc(-3vw - 76px) auto calc(-3vw + 76px);
      height: 48vh;
      overflow: hidden;
      color: rgba(255,255,255,.68);
      font: italic 700 clamp(48px, calc(7vw + 6px), 134px)/.86 Georgia, serif;
      letter-spacing: -.035em;
      white-space: nowrap;
      transform: rotate(-7deg);
      pointer-events: none;
    }
    .ghost-script .accent {
      color: rgba(254, 84, 22, .8);
    }
    .orbit {
      position: absolute;
      left: 50%;
      top: 55%;
      width: min(79vw, 1320px);
      height: min(38vh, 380px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 1;
    }
    .orbit:hover .tile { animation-play-state: paused; }
    .orbit:hover .tile:hover { animation-play-state: paused, running; }
    .tile {
      position: absolute;
      left: 0;
      top: 0;
      width: clamp(48px, 5.8vw, 102px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 22%;
      color: #5f5f5a;
      font: 500 clamp(8px, .55vw, 10px)/1 ui-monospace, monospace;
      offset-path: ellipse(calc(47% - 55px) calc(47% - 55px) at 50% 50%);
      offset-distance: var(--orbit-start);
      offset-rotate: 0deg;
      transform: rotate(var(--tile-tilt, 0deg));
      animation: orbit-clockwise 72s linear infinite;
    }
    .tile:hover { animation: orbit-clockwise 72s linear infinite, tile-sway .62s ease-in-out 1; }
    .tile:nth-child(1) { background: var(--placeholder-b); --tile-tilt: 12deg; --orbit-start: 0%; }
    .tile:nth-child(2) { background: var(--placeholder-c); --tile-tilt: -9deg; --orbit-start: 10%; }
    .tile:nth-child(3) { background: var(--placeholder-a); --tile-tilt: 10deg; --orbit-start: 20%; }
    .tile:nth-child(4) { background: var(--placeholder-c); --tile-tilt: -5deg; --orbit-start: 30%; }
    .tile:nth-child(5) { background: var(--placeholder-b); --tile-tilt: 8deg; --orbit-start: 40%; }
    .tile:nth-child(6) { background: var(--placeholder-c); --tile-tilt: 12deg; --orbit-start: 50%; }
    .tile:nth-child(7) { background: var(--placeholder-a); --tile-tilt: -8deg; --orbit-start: 60%; }
    .tile:nth-child(8) { background: var(--placeholder-b); --tile-tilt: 9deg; --orbit-start: 70%; }
    .tile:nth-child(9) { background: var(--placeholder-c); --tile-tilt: -6deg; --orbit-start: 80%; }
    .tile:nth-child(10) { background: var(--placeholder-a); --tile-tilt: 5deg; --orbit-start: 90%; }
    @keyframes orbit-clockwise {
      from { offset-distance: var(--orbit-start); }
      to { offset-distance: calc(var(--orbit-start) + 100%); }
    }
    @keyframes tile-sway {
      0%, 100% { transform: rotate(var(--tile-tilt)); }
      34% { transform: rotate(calc(var(--tile-tilt) - 3deg)); }
      68% { transform: rotate(calc(var(--tile-tilt) + 2.4deg)); }
    }
    .portrait {
      position: absolute;
      left: 50%;
      top: 55%;
      width: clamp(112px, 9.2vw, 176px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      text-align: center;
      border-radius: 50%;
      background: #a9a9a5;
      color: #4c4c48;
      font: 500 clamp(9px, .65vw, 12px)/1.4 ui-monospace, monospace;
      overflow: hidden;
      z-index: 3;
    }
    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 42%;
    }
    .identity {
      position: absolute;
      left: 50%;
      top: 69%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 3;
    }
    .identity strong {
      display: block;
      font-size: clamp(24px, 1.8vw, 36px);
      line-height: 1.1;
    }
    .identity span {
      display: block;
      margin-top: .7vh;
      font-size: clamp(14px, 1.05vw, 20px);
    }
    .identity .contact-line {
      margin-top: .45vh;
      color: var(--muted);
     white-space: nowrap;
    }
    .next-title {
      position: absolute;
      left: 50%;
      top: 91%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      font: 400 clamp(54px, 7.3vw, 140px)/.92 Arial, sans-serif;
      letter-spacing: -.035em;
      white-space: nowrap;
      z-index: 3;
    }
    .next-title span {
      display: block;
      width: max-content;
      margin-inline: auto;
    }
    .next-title span:first-child { transform: translateX(-5vw); }
    .next-title span:last-child { transform: translateX(5vw); }
    .confirm {
      position: absolute;
      right: clamp(18px, 2.4vw, 48px);
      bottom: clamp(14px, 1.8vh, 26px);
      z-index: 12;
      min-width: 44px;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid rgba(0,0,0,.28);
      border-radius: 999px;
      background: rgba(238,238,238,.88);
      color: var(--ink);
      font: 500 11px/1 ui-monospace, monospace;
      cursor: pointer;
    }
    @media (max-width: 760px) {
      .utility span:nth-child(-n+2), .side-copy, .ghost-script { display: none; }
      .orbit { width: 116vw; }
      .tile { width: clamp(42px, 13vw, 58px); }
      .portrait { top: 52%; width: 108px; }
      .identity { top: 66%; }
      .next-title { top: 89%; font-size: clamp(46px, 15vw, 72px); }
      .next-title span:first-child { transform: translateX(-4vw); }
      .next-title span:last-child { transform: translateX(4vw); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .orbit, .tile { animation: none !important; }
      .home-transition-frame-preview { display: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="utility" aria-label="快捷信息">
      <span>18100839418</span>
      <span>1042369137@qq.com</span>
      <span>PDF 简历 ↓</span>
    </nav>

    <div class="ghost-script" aria-hidden="true"><span class="accent">ESTJ</span> | curiosity, courage</div>

    <div class="orbit" aria-label="首页叙事素材占位">
      <div class="tile">xxxx</div><div class="tile">xxxx</div>
      <div class="tile">xxxx</div><div class="tile">xxxx</div>
      <div class="tile">xxxx</div><div class="tile">xxxx</div>
      <div class="tile">xxxx</div><div class="tile">xxxx</div>
      <div class="tile">xxxx</div><div class="tile">xxxx</div>
    </div>

    <div class="portrait"><img src="./assets/gioia-home.jpg" alt="官晓彤与银色机器人合影"></div>
    <div class="identity">
      <strong>官晓彤 Gioia</strong>
      <span>AI 产品经理 · FROM 浙江</span>
      <span class="contact-line">VX &amp; PHONE 18100839418 · EMAIL 1042369137@qq.com</span>
    </div>
    <div class="next-title">
      <span>有创意，把好点子想出来；</span>
      <span>懂执行，把好点子做出来</span>
    </div>

    <img class="home-transition-frame-preview" src="./assets/home-to-directory/frame_000001.webp" alt="" aria-hidden="true" draggable="false">

    <button class="confirm" data-choice="homepage-v5-approved" onclick="toggleSelect(this)">
      此比例正确
    </button>
</main>
  <script>
    function alignOrbitToPortrait() {
      const page = document.querySelector(".page");
      const orbit = document.querySelector(".orbit");
      const portrait = document.querySelector(".portrait");
      const contact = document.querySelector(".contact-line");
      if (!page || !orbit || !portrait || !contact) return;
      const pageRect = page.getBoundingClientRect();
      const portraitRect = portrait.getBoundingClientRect();
      const contactRect = contact.getBoundingClientRect();
      const centerX = portraitRect.left + portraitRect.width / 2 - pageRect.left;
      const centerY = portraitRect.top + portraitRect.height / 2 - pageRect.top;
      const lowerEdge = contactRect.bottom + 5 - pageRect.top;
      const visibleRadius = Math.max(60, lowerEdge - centerY);
      const fullHeight = visibleRadius * 3.3;
      const orbitTop = centerY - fullHeight / 2;
      orbit.style.left = `${centerX}px`;
      orbit.style.top = `${centerY}px`;
      orbit.style.height = `${fullHeight}px`;
      page.style.setProperty("--orbit-mask-top", `${lowerEdge - 18}px`);
    }
    addEventListener("load", alignOrbitToPortrait);
    addEventListener("resize", alignOrbitToPortrait);
  </script>
</body>
</html>
