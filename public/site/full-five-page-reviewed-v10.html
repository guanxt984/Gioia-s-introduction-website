<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五页批注修正版 V10</title>
  <style id="review-revisions">
    /* Liquid-glass is deliberately limited to the two persistent navigation tabs. */
    .global-utility,
    .identity-tab {
      position: fixed;
      z-index: 90;
      top: 14px !important;
      min-height: 44px;
      display: flex;
      align-items: center;
      border: 1px solid rgba(255,255,255,.72);
      background: rgba(238,238,238,.56) !important;
      box-shadow:
        0 1px 0 rgba(255,255,255,.78) inset,
        0 4px 8px rgba(29,24,18,.08);
      backdrop-filter: blur(18px) saturate(145%);
      -webkit-backdrop-filter: blur(18px) saturate(145%);
    }
    .global-utility {
      right: 14px !important;
      padding: 0 16px !important;
      border-radius: 999px;
    }
    .identity-tab {
      left: 14px;
      gap: 10px;
      padding: 5px 14px 5px 6px;
      border-radius: 999px;
      color: var(--ink);
      font: 600 clamp(11px,.78vw,14px)/1 var(--font-rational);
    }
    .identity-avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 50%;
      background: #c8c8c4;
      box-shadow: 0 0 0 1px rgba(0,0,0,.07);
    }
    .page-index { display: none !important; }

    /* Comment 1: expose the complete next-page title inside the home viewport. */
    #home .next-title {
      top: 82.5% !important;
      font-size: clamp(28px, 3.3vw, 64px) !important;
      line-height: 1.28 !important;
    }

    /* Comment 3: lower the pale background lettering so its shapes read. */
    #home .ghost-script {
      inset: calc(2.5vh - 20px) calc(-3vw - 76px) auto calc(-3vw + 76px) !important;
      height: 52vh !important;
      color: rgba(255,255,255,.76) !important;
    }
    #home .ghost-script .accent {
      color: rgba(254, 84, 22, .8) !important;
    }

    /* Comment 4: the PDF sheet stands independently on the left. */
    #resume .resume-inner {
      inset: clamp(70px, 10vh, 106px) clamp(28px, 7vw, 128px) clamp(42px, 7vh, 72px) !important;
      display: grid !important;
      grid-template-columns: minmax(250px, .82fr) minmax(0, 1.35fr);
      grid-template-rows: auto minmax(0, 1fr);
      column-gap: clamp(40px, 6vw, 96px);
      row-gap: clamp(18px, 3vh, 34px);
    }
    #resume .resume-heading {
      grid-column: 2;
      grid-row: 1;
      margin: 0 !important;
      align-self: end;
    }
    #resume .resume-heading .section-title {
      max-width: 8.5ch;
      font-size: clamp(36px, 4.7vw, 78px) !important;
    }
    #resume .resume-content { display: contents !important; }
    #resume .resume-document {
      grid-column: 1;
      grid-row: 1 / 3;
      width: min(100%, 430px);
      height: 100%;
      justify-self: start;
      transform: scale(1.8) !important;
      transform-origin: center;
    }
    #resume .resume-rows {
      grid-column: 2;
      grid-row: 2;
      min-height: 0;
      overflow: hidden;
      border-top: 1px solid var(--line-strong);
    }
    #resume .resume-row {
      min-height: clamp(50px, 7.4vh, 74px) !important;
    }

    /* Comment 5: no decorative actions without behavior. */
    #destination .actions { display: none !important; }
    #destination .destination-meta {
      margin-top: clamp(28px, 5vh, 52px) !important;
    }

    @media (max-width: 767px) {
      .global-utility {
        right: 8px !important;
        padding: 0 12px !important;
      }
      .identity-tab {
        left: 8px;
        padding-right: 12px;
      }
      .identity-avatar {
        width: 32px;
        height: 32px;
        flex-basis: 32px;
      }
      #home .next-title {
        top: 79% !important;
        font-size: clamp(24px, 7.2vw, 40px) !important;
      }
      #resume .resume-inner {
        inset: 70px 18px 42px !important;
        display: grid !important;
        grid-template-columns: 42% 1fr;
        grid-template-rows: auto minmax(0,1fr);
        column-gap: 18px;
        row-gap: 14px;
      }
      #resume .resume-heading {
        grid-column: 2;
        grid-row: 1;
      }
      #resume .resume-heading .meta { display: none; }
      #resume .resume-heading .section-title {
        font-size: clamp(30px, 8vw, 44px) !important;
      }
      #resume .resume-document {
        display: grid !important;
        grid-column: 1;
        grid-row: 1 / 3;
      }
      #resume .resume-rows {
        grid-column: 2;
        grid-row: 2;
      }
      #resume .resume-row {
        grid-template-columns: 1fr !important;
        min-height: 58px !important;
      }
      #resume .resume-row span:first-child,
      #resume .resume-row span:last-child { display: none; }
    }
  </style>
</head>
<body>
  <main id="render-root">
    <div style="display:grid;place-items:center;width:100vw;height:100svh;background:#eeeeee;color:#524d46;font:500 12px/1.4 ui-monospace,monospace">
      正在应用浏览器批注…
    </div>
  </main>

  <script>
    Promise.all([
      fetch('/files/homepage-viewport-fit-v5.html').then(function (response) {
        if (!response.ok) throw new Error('首页结构载入失败');
        return response.text();
      }),
      fetch('/files/full-five-page-structure-v8.html').then(function (response) {
        if (!response.ok) throw new Error('五页结构载入失败');
        return response.text();
      }),
      fetch('/files/full-five-page-coveo-render-v9.html').then(function (response) {
        if (!response.ok) throw new Error('COVEO 样式载入失败');
        return response.text();
      })
    ]).then(function (sources) {
      var homepage = new DOMParser().parseFromString(sources[0], 'text/html');
      var structure = new DOMParser().parseFromString(sources[1], 'text/html');
      var coveo = new DOMParser().parseFromString(sources[2], 'text/html');

      var homepageStyle = homepage.querySelector('style');
      var homepagePage = homepage.querySelector('.page');
      var structureStyle = structure.querySelector('style');
      var structureBody = structure.body.cloneNode(true);
      var coveoStyle = coveo.querySelector('#coveo-polish');
      if (!homepageStyle || !homepagePage || !structureStyle || !coveoStyle) {
        throw new Error('预览结构不完整');
      }

      structureBody.querySelectorAll('script').forEach(function (script) { script.remove(); });
      homepagePage.querySelector('.utility')?.remove();
      homepagePage.querySelector('.confirm')?.remove();
      structureBody.querySelector('#home').replaceChildren(homepagePage.cloneNode(true));
      structureBody.querySelector('#destination .actions')?.remove();

      var identity = document.createElement('div');
      identity.className = 'identity-tab';
      identity.innerHTML = '<span class="identity-avatar" aria-hidden="true"></span><span>xxx姓名xxx</span>';
      structureBody.prepend(identity);

      [homepageStyle, structureStyle, coveoStyle].forEach(function (sourceStyle) {
        var style = document.createElement('style');
        style.textContent = sourceStyle.textContent;
        document.head.insertBefore(style, document.getElementById('review-revisions'));
      });

      var root = document.getElementById('render-root');
      root.replaceWith.apply(root, Array.from(structureBody.children));
    }).catch(function (error) {
      document.getElementById('render-root').textContent = error.message;
    });
  </script>
</body>
</html>
