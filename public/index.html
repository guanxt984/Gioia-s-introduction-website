<!DOCTYPE html>
<html lang="zh-CN" data-portfolio-version="v11">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Product Manager Portfolio</title>
  <link rel="preload" href="./models/experience-island-uploaded-preview.glb" as="fetch" crossorigin>
  <script type="module" src="./portfolio-island.bundle.js"></script>
  <script type="module" src="./home-transition.bundle.js"></script>
  <style id="final-removal">
    .global-utility,
    .identity-tab {
      display: none !important;
    }
  </style>
  <style id="island-3d-integration">
    #experience.stage {
      overflow: visible !important;
      clip-path: none !important;
      mask: none !important;
      -webkit-mask: none !important;
    }
    .island-area.is-3d {
      display: block;
      overflow: visible !important;
      clip-path: none !important;
      mask: none !important;
      -webkit-mask: none !important;
      contain: none !important;
      border-radius: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      color: var(--ink);
    }
    .island-area.is-3d::after { display: none !important; }
    .island-canvas {
      position: absolute;
      inset: auto;
      left: 50%;
      top: 50%;
      width: 70vw;
      height: 110vh;
      overflow: visible !important;
      clip-path: none !important;
      mask: none !important;
      -webkit-mask: none !important;
      transform: translate(calc(-50% - 20px), -50%);
      min-width: 1px;
      min-height: 1px;
      touch-action: none;
      cursor: grab;
    }
    .island-canvas:active { cursor: grabbing; }
    .island-canvas canvas {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible !important;
      clip-path: none !important;
      mask: none !important;
      -webkit-mask: none !important;
      outline: none;
    }
    .island-project-labels {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }
    .experience-project-label {
      position: absolute;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
      padding: 4px 7px;
      border: 1px solid rgba(38, 36, 31, .48);
      border-radius: 2px;
      background: rgba(255, 253, 248, .88);
      color: var(--ink);
      font: 600 clamp(9px, .62vw, 10px)/1.2 Arial, "Noto Sans SC", sans-serif;
      letter-spacing: .01em;
      white-space: nowrap;
      cursor: pointer;
      pointer-events: auto;
      transform: translate(8px, calc(-100% - 8px));
      transition: background-color .18s ease, border-color .18s ease, translate .18s cubic-bezier(.16, 1, .3, 1);
    }
    .experience-project-label[hidden] { display: none; }
    .experience-project-label::before {
      content: "";
      width: 5px;
      height: 5px;
      flex: 0 0 5px;
      border-radius: 50%;
      background: var(--ink);
      box-shadow: 0 0 0 2px rgba(255, 253, 248, .88);
    }
    .experience-project-label::after {
      content: "";
      position: absolute;
      left: 10px;
      top: 100%;
      width: 12px;
      height: 8px;
      border-left: 1px solid rgba(38, 36, 31, .48);
      border-bottom: 1px solid rgba(38, 36, 31, .48);
      pointer-events: none;
    }
    .experience-project-label.is-disabled {
      color: var(--muted);
      border-style: dashed;
      background: rgba(255, 253, 248, .72);
      cursor: default;
      pointer-events: none;
    }
    .experience-project-label small {
      margin-left: 2px;
      color: var(--muted);
      font: 500 7px/1 Arial, "Noto Sans SC", sans-serif;
      letter-spacing: .05em;
    }
    .experience-project-label:hover,
    .experience-project-label:focus-visible,
    .experience-project-label.is-active {
      background: rgba(255, 253, 248, .98);
      border-color: var(--ink);
      translate: 0 -2px;
      outline: none;
    }
    .experience-project-label.is-active::before { background: var(--accent); }
    .island-loading {
      position: absolute;
      left: 50%;
      bottom: -24px;
      z-index: 2;
      width: max-content;
      max-width: 100%;
      margin: 0;
      transform: translateX(-50%);
      color: var(--muted);
      font: 500 clamp(9px, .65vw, 11px)/1.4 ui-monospace, monospace;
      text-align: center;
      pointer-events: none;
    }
    .island-retry {
      position: absolute;
      left: 50%;
      bottom: 8px;
      z-index: 3;
      transform: translateX(-50%);
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--canvas);
      color: var(--ink);
      font: 500 11px/1 ui-monospace, monospace;
      cursor: pointer;
    }
    .island-retry[hidden] { display: none; }
    .webgl-unavailable .island-canvas { display: none; }
    @media (max-width: 760px) {
      .island-canvas {
        inset: auto;
        left: 50%;
        top: 50%;
        width: 110vw;
        height: 70vh;
        transform: translate(calc(-50% - 20px), -50%);
      }
      .island-loading { bottom: -20px; font-size: 9px; }
      .experience-project-label { min-height: 24px; padding: 5px 7px; font-size: 8px; }
      .experience-project-label::after { width: 13px; height: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .experience-project-label { transition: none; }
      .experience-project-label:hover,
      .experience-project-label:focus-visible,
      .experience-project-label.is-active { translate: 0; }
    }
  </style>
</head>
<body>
  <main id="render-root">
    <div style="display:grid;place-items:center;width:100vw;height:100svh;background:#eeeeee;color:#524d46;font:500 12px/1.4 ui-monospace,monospace">
      正在移除悬浮 Tab…
    </div>
  </main>

  <script>
    Promise.all([
      fetch('./site/homepage-viewport-fit-v5.html').then(function (response) {
        if (!response.ok) throw new Error('首页结构载入失败');
        return response.text();
      }),
      fetch('./site/full-five-page-structure-v8.html').then(function (response) {
        if (!response.ok) throw new Error('五页结构载入失败');
        return response.text();
      }),
      fetch('./site/full-five-page-coveo-render-v9.html').then(function (response) {
        if (!response.ok) throw new Error('COVEO 样式载入失败');
        return response.text();
      }),
      fetch('./site/full-five-page-reviewed-v10.html').then(function (response) {
        if (!response.ok) throw new Error('批注样式载入失败');
        return response.text();
      })
    ]).then(function (sources) {
      var homepage = new DOMParser().parseFromString(sources[0], 'text/html');
      var structure = new DOMParser().parseFromString(sources[1], 'text/html');
      var coveo = new DOMParser().parseFromString(sources[2], 'text/html');
      var reviewed = new DOMParser().parseFromString(sources[3], 'text/html');

      var homepageStyle = homepage.querySelector('style');
      var homepagePage = homepage.querySelector('.page');
      var structureStyle = structure.querySelector('style');
      var structureBody = structure.body.cloneNode(true);
      var coveoStyle = coveo.querySelector('#coveo-polish');
      var reviewStyle = reviewed.querySelector('#review-revisions');
      if (!homepageStyle || !homepagePage || !structureStyle || !coveoStyle || !reviewStyle) {
        throw new Error('预览结构不完整');
      }

      structureBody.querySelectorAll('script').forEach(function (script) { script.remove(); });
      structureBody.querySelector('.global-utility')?.remove();
      structureBody.querySelector('#destination .actions')?.remove();
      homepagePage.querySelector('.utility')?.remove();
      homepagePage.querySelector('.confirm')?.remove();
      structureBody.querySelector('#home').replaceChildren(homepagePage.cloneNode(true));

      [homepageStyle, structureStyle, coveoStyle, reviewStyle].forEach(function (sourceStyle) {
        var style = document.createElement('style');
        style.textContent = sourceStyle.textContent;
        document.head.insertBefore(style, document.getElementById('final-removal'));
      });

      var root = document.getElementById('render-root');
      root.replaceWith.apply(root, Array.from(structureBody.children));
      var islandArea = document.querySelector('.island-area');
      if (islandArea) {
        islandArea.classList.remove('placeholder');
        islandArea.classList.add('is-3d');
        islandArea.innerHTML = [
          '<div class="island-canvas" aria-label="\u53ef\u65cb\u8f6c\u7684 3D \u7ecf\u5386\u5c9b">',
          '<div class="island-project-labels" aria-label="\u7ecf\u5386\u5c9b\u9879\u76ee\u5730\u6807">',
          '<button class="experience-project-label is-internship" type="button" data-experience-project="internship-lixiang" aria-pressed="false">北京 · 理想</button>',
          '<button class="experience-project-label is-internship" type="button" data-experience-project="internship-qianchuan" aria-pressed="false">上海 · 仟传</button>',
          '<button class="experience-project-label is-internship" type="button" data-experience-project="internship-baimi" aria-pressed="false">杭州 · 白米</button>',
          '<button class="experience-project-label is-internship" type="button" data-experience-project="internship-jiuling" aria-pressed="false">深圳 · 九瓴</button>',
          '<button class="experience-project-label is-personal" type="button" data-experience-project="personal-claude-translator" aria-pressed="false">Claude 桌面翻译 <small>COMING SOON</small></button>',
          '<button class="experience-project-label is-personal" type="button" data-experience-project="personal-squirrel-docs" aria-pressed="false">Codex 松鼠文仓 <small>COMING SOON</small></button>',
          '<button class="experience-project-label is-personal" type="button" data-experience-project="personal-fullydancy" aria-pressed="false">Codex FullyDancy <small>COMING SOON</small></button>',
          '<button class="experience-project-label is-school" type="button" data-experience-project="school-uiux" aria-pressed="false">UIUX</button>',
          '<button class="experience-project-label is-school" type="button" data-experience-project="school-apex" aria-pressed="false">APEX</button>',
          '<button class="experience-project-label is-school" type="button" data-experience-project="school-cell-factory" aria-pressed="false">细胞工厂</button>',
          '</div>',
          '</div>',
          '<p class="island-loading" role="status">\u6b63\u5728\u52a0\u8f7d\u7ecf\u5386\u5c9b\u6a21\u578b\u2026</p>',
          '<button class="island-retry" type="button" hidden>\u91cd\u65b0\u52a0\u8f7d\u6a21\u578b</button>'
        ].join('');
      }
      alignHomepageOrbit();
      initSkillCloudInteractions();
      window.dispatchEvent(new Event('portfolio:ready'));
    }).catch(function (error) {
      document.getElementById('render-root').textContent = error.message;
    });

    function alignHomepageOrbit() {
      var page = document.querySelector('#home .page');
      var orbit = page && page.querySelector('.orbit');
      var portrait = page && page.querySelector('.portrait');
      var contact = page && page.querySelector('.contact-line');
      if (!page || !orbit || !portrait || !contact) return;

      function align() {
        var pageRect = page.getBoundingClientRect();
        var portraitRect = portrait.getBoundingClientRect();
        var contactRect = contact.getBoundingClientRect();
        var centerX = portraitRect.left + portraitRect.width / 2 - pageRect.left;
        var centerY = portraitRect.top + portraitRect.height / 2 - pageRect.top;
        var lowerEdge = contactRect.bottom + 5 - pageRect.top;
        var visibleRadius = Math.max(60, lowerEdge - centerY);
        var fullHeight = visibleRadius * 3.3;
        orbit.style.left = centerX + 'px';
        orbit.style.top = centerY + 'px';
        orbit.style.height = fullHeight + 'px';
        page.style.setProperty('--orbit-mask-top', (lowerEdge - 18) + 'px');
      }

      align();
      window.addEventListener('resize', align, { passive: true });
    }

    function initSkillCloudInteractions() {
      var skills = document.getElementById('skills');
      if (!skills) return;

      var chips = Array.prototype.slice.call(skills.querySelectorAll('.skill-chip'));
      chips.forEach(function (chip, index) {
        var sign = index % 2 === 0 ? 1 : -1;
        var x = (1.2 + Math.random() * 2.8) * sign;
        var y = -2.8 + Math.random() * 5.6;
        var r = (.45 + Math.random() * 1.4) * sign;
        chip.style.setProperty('--shake-x', x.toFixed(2) + 'px');
        chip.style.setProperty('--shake-y', y.toFixed(2) + 'px');
        chip.style.setProperty('--shake-x2', (-x * .72).toFixed(2) + 'px');
        chip.style.setProperty('--shake-y2', (-y * .58).toFixed(2) + 'px');
        chip.style.setProperty('--shake-r', r.toFixed(2) + 'deg');
        chip.style.setProperty('--shake-r2', (-r * .8).toFixed(2) + 'deg');
        chip.style.setProperty('--shake-delay', (index * .055).toFixed(3) + 's');
      });

      var zones = Array.prototype.slice.call(skills.querySelectorAll('.skill-cloud-zone'));
      var viewedKey = 'portfolio.skillCloud.viewed.v1';
      var viewed = {};
      try {
        viewed = JSON.parse(localStorage.getItem(viewedKey) || '{}') || {};
      } catch (error) {
        viewed = {};
      }

      function saveViewed() {
        try {
          localStorage.setItem(viewedKey, JSON.stringify(viewed));
        } catch (error) {}
      }

      function applyViewedState() {
        chips.forEach(function (chip) {
          var skill = chip.getAttribute('data-skill');
          chip.classList.toggle('is-viewed', Boolean(viewed[skill]));
        });
        zones.forEach(function (zone) {
          var hasViewedSkill = Array.prototype.some.call(zone.querySelectorAll('.skill-chip'), function (chip) {
            return Boolean(viewed[chip.getAttribute('data-skill')]);
          });
          zone.classList.toggle('is-viewed', hasViewedSkill);
        });
      }

      function markSkillViewed(chip) {
        var skill = chip.getAttribute('data-skill');
        if (!skill) return;
        viewed[skill] = true;
        saveViewed();
        applyViewedState();
      }

      applyViewedState();

      var rect = skills.getBoundingClientRect();
      var targetX = rect.width / 2;
      var targetY = rect.height / 2;
      var currentX = targetX;
      var currentY = targetY;
      var targetOpacity = 0;
      var currentOpacity = 0;
      var frame = 0;

      function paintSpotlight() {
        currentX += (targetX - currentX) * .18;
        currentY += (targetY - currentY) * .18;
        currentOpacity += (targetOpacity - currentOpacity) * .12;
        skills.style.setProperty('--spotlight-x', currentX.toFixed(1) + 'px');
        skills.style.setProperty('--spotlight-y', currentY.toFixed(1) + 'px');
        skills.style.setProperty('--spotlight-opacity', currentOpacity.toFixed(3));

        if (Math.abs(targetX - currentX) > .25 || Math.abs(targetY - currentY) > .25 || Math.abs(targetOpacity - currentOpacity) > .006) {
          frame = requestAnimationFrame(paintSpotlight);
        } else {
          frame = 0;
        }
      }

      function startSpotlight() {
        if (!frame) frame = requestAnimationFrame(paintSpotlight);
      }

      function setActive(zone) {
        zones.forEach(function (item) {
          item.classList.toggle('is-active', item === zone);
        });
      }

      skills.addEventListener('pointermove', function (event) {
        var bounds = skills.getBoundingClientRect();
        targetX = event.clientX - bounds.left;
        targetY = event.clientY - bounds.top;
        targetOpacity = .98;
        skills.classList.add('is-spotlight-on');
        startSpotlight();
      });

      skills.addEventListener('pointerleave', function () {
        targetOpacity = 0;
        skills.classList.remove('is-spotlight-on');
        zones.forEach(function (zone) { zone.classList.remove('is-active'); });
        startSpotlight();
      });

      zones.forEach(function (zone) {
        zone.addEventListener('pointerenter', function () {
          setActive(zone);
        });
        zone.addEventListener('pointerleave', function () {
          zone.classList.remove('is-active');
        });
        zone.addEventListener('focusin', function () {
          var bounds = skills.getBoundingClientRect();
          var zoneBounds = zone.getBoundingClientRect();
          targetX = zoneBounds.left + zoneBounds.width / 2 - bounds.left;
          targetY = zoneBounds.top + zoneBounds.height / 2 - bounds.top;
          targetOpacity = .98;
          skills.classList.add('is-spotlight-on');
          setActive(zone);
          startSpotlight();
        });
        zone.addEventListener('focusout', function (event) {
          if (!zone.contains(event.relatedTarget)) zone.classList.remove('is-active');
        });
      });

      var dialog = document.querySelector('.skill-detail-dialog');
      if (!dialog) return;
      var title = dialog.querySelector('[data-skill-title]');
      var body = dialog.querySelector('[data-skill-body]');
      var proof = dialog.querySelector('[data-skill-proof]');
      var close = dialog.querySelector('.skill-detail-close');
      var energyDetails = {
        '象棋': {
          body: '象棋是我的推演训练：在有限信息里判断局势、预判对手意图，并持续修正自己的策略。',
          media: [
            { type: 'image', src: 'assets/energy/xiangqi.jpg', alt: '象棋兴趣记录' }
          ]
        },
        '羽毛球': {
          body: '羽毛球代表反应速度、节奏感和持续行动力。它让我在高强度对抗里保持专注，也训练快速调整状态。',
          media: [
            { type: 'image', src: 'assets/energy/badminton-01.jpg', alt: '羽毛球训练记录一' },
            { type: 'image', src: 'assets/energy/badminton-02.png', alt: '羽毛球训练记录二' }
          ]
        },
        '吉他': {
          body: '吉他是感受力和表达欲的出口：从节奏、旋律到练习反馈，保持对细节和情绪的敏感。',
          media: [
            { type: 'video', src: 'assets/energy/guitar.mp4', alt: '吉他练习视频' }
          ]
        },
        '健身': {
          body: '健身是高精力的底层系统。稳定训练让我保持更强的体能、恢复力和长期执行力。',
          media: [
            { type: 'image', src: 'assets/energy/fitness-01.jpg', alt: '健身记录一' },
            { type: 'image', src: 'assets/energy/fitness-02.jpg', alt: '健身记录二' }
          ]
        }
      };
      function renderProof(item) {
        if (!item || !item.media) {
          return '<span>佐证 01 · xxx相关资料xxx</span>';
        }
        return '<div class="skill-proof-gallery">' + item.media.map(function (asset) {
          if (asset.type === 'video') {
            return '<video src="' + asset.src + '" controls playsinline preload="metadata" aria-label="' + asset.alt + '"></video>';
          }
          return '<img src="' + asset.src + '" alt="' + asset.alt + '">';
        }).join('') + '</div>';
      }

      chips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          var skill = chip.getAttribute('data-skill');
          markSkillViewed(chip);
          title.textContent = skill;
          var item = energyDetails[skill];
          dialog.classList.toggle('is-media-only', Boolean(item));
          body.textContent = item ? item.body : 'xxx' + skill + '能力说明与项目佐证资料xxx';
          proof.innerHTML = item ? renderProof(item) : '<span>佐证 01 · xxx相关项目资料xxx</span><span>佐证 02 · xxx过程产出或复盘xxx</span>';
          if (typeof dialog.showModal === 'function') dialog.showModal();
          else dialog.setAttribute('open', '');
        });
      });
      if (close) close.addEventListener('click', function () { dialog.close(); });
      dialog.addEventListener('click', function (event) {
        if (event.target === dialog) dialog.close();
      });
    }
  </script>
</body>
</html>
